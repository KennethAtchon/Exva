<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!--
      Content Security Policy: lock down what the renderer can load. Fonts are
      bundled locally via @fontsource — no Google Fonts CDN. 'unsafe-inline' on
      style-src is required for Tailwind's runtime style injection. Vite dev
      server adds 'ws:' for HMR; the production build never hits the dev URL
      because index.html is loaded from file://.
    -->
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; font-src 'self' data:; img-src 'self' data: blob:; connect-src 'self' ws: http://localhost:*; object-src 'none'; base-uri 'self'; frame-ancestors 'none';"
    />
    <title>Exva</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>

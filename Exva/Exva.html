<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Exva</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />

  <script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>

  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg:         #080b10;
      --surface:    #0d1219;
      --surface2:   #121a24;
      --surface3:   #1a2333;
      --chip:       #1e2a38;
      --border:     #1e2a38;
      --text1:      #edf2f7;
      --text2:      #8896a8;
      --text3:      #4a5a6a;
      --accent:     oklch(0.65 0.14 240);
      --accent-dim: rgba(96,165,250,0.2);
      --font-sans:  'Inter', system-ui, sans-serif;
      --font-mono:  'JetBrains Mono', 'Fira Code', monospace;
    }

    html, body, #root {
      width: 100%; height: 100%;
      background: var(--bg);
      color: var(--text1);
      font-family: var(--font-sans);
      -webkit-font-smoothing: antialiased;
      text-rendering: optimizeLegibility;
    }

    ::-webkit-scrollbar       { width: 5px; height: 5px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: var(--surface3); border-radius: 3px; }

    button { font-family: inherit; cursor: pointer; }
    input  { font-family: inherit; color: inherit; }
    input::placeholder { color: var(--text3); }

    @keyframes slideIn {
      from { transform: translateX(30px); opacity: 0; }
      to   { transform: translateX(0);    opacity: 1; }
    }

    @keyframes pulse-dot {
      0%, 100% { opacity: 1;   transform: scale(1);    }
      50%       { opacity: 0.5; transform: scale(0.75); }
    }

    input[type=range] { -webkit-appearance: none; appearance: none; }

    button:active { opacity: 0.75; }

    /* Remove autofill background */
    input:-webkit-autofill { -webkit-box-shadow: 0 0 0 100px var(--surface2) inset; -webkit-text-fill-color: var(--text1); }
  </style>
</head>
<body>
  <div id="root"></div>

  <script>
    window.__TWEAK_DEFAULTS = /*EDITMODE-BEGIN*/{
      "accentColor": "oklch(0.65 0.14 240)",
      "bgColor": "#080b10",
      "fontMono": "'JetBrains Mono', monospace"
    }/*EDITMODE-END*/;
  </script>

  <script type="text/babel" src="shared.jsx"></script>
  <script type="text/babel" src="layout.jsx"></script>
  <script type="text/babel" src="dashboard.jsx"></script>
  <script type="text/babel" src="tradedetail.jsx"></script>
  <script type="text/babel" src="config.jsx"></script>
  <script type="text/babel" src="costs.jsx"></script>
  <script type="text/babel" src="devpanel.jsx"></script>
  <script type="text/babel" src="accounts.jsx"></script>
  <script type="text/babel" src="app.jsx"></script>
</body>
</html>

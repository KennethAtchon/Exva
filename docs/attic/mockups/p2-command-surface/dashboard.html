<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>P2 Command Surface — Dashboard</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../skin.css">
</head>
<body>
  <div class="app">
    <div class="main">
      <header class="topbar">
        <span class="topbar-title">Exva</span>
        <nav class="flex gap-sm" style="margin-left:16px">
          <a class="btn btn-ghost btn-sm" href="dashboard.html" style="color:var(--text)">Dashboard</a>
          <a class="btn btn-ghost btn-sm" href="sessions.html">Sessions</a>
        </nav>
        <span class="topbar-spacer"></span>
        <button class="cmd-trigger" data-cmd-open><span>Search…</span> <kbd>⌘K</kbd></button>
      </header>
      <div class="content">
        <div class="stats">
          <div><div class="stat-label">Equity</div><div class="stat-value tabular" id="equity"></div></div>
          <div><div class="stat-label">Day P&amp;L</div><div class="stat-value up tabular" id="day-pnl"></div></div>
          <div><div class="stat-label">Open Risk</div><div class="stat-value tabular" id="open-risk"></div></div>
        </div>
        <div class="page-header">
          <h1>Positions</h1>
          <span class="meta">⌘K to navigate — no sidebar</span>
        </div>
        <div class="table-wrap">
          <table class="data">
            <thead>
              <tr>
                <th>Symbol</th><th>Side</th><th class="num">Qty</th><th class="num">Avg</th>
                <th class="num">Last</th><th class="num">P&amp;L</th><th class="num">%</th>
                <th>Session</th><th>EQ</th>
              </tr>
            </thead>
            <tbody id="positions-body"></tbody>
          </table>
        </div>
        <div class="expand-panel mt-8" id="nvda-expand">
          <div class="expand-panel-header">NVDA — inline detail</div>
          <div class="expand-panel-body">
            <div class="flex" style="gap:24px">
              <div><span class="stat-label">P&amp;L</span><div class="stat-value up" style="font-size:16px">+771.60</div></div>
              <div><span class="stat-label">Last</span><div class="stat-value" style="font-size:16px">124.85</div></div>
              <div><span class="stat-label">Stop</span><div class="stat-value" style="font-size:16px">122.10</div></div>
            </div>
            <div class="mt-8" id="trace-inline"></div>
          </div>
        </div>
        <div class="mt-16">
          <div class="page-header"><h1>Attention</h1></div>
          <div class="table-wrap" id="attention-list"></div>
        </div>
      </div>
    </div>
  </div>
  <div class="cmd-overlay" id="cmd-overlay">
    <div class="cmd-menu">
      <div class="cmd-input-wrap"><span>⌘</span><input class="cmd-input" id="cmd-input" placeholder="Type a command or search…" value="nvda"></div>
      <div class="cmd-list" id="cmd-list"></div>
    </div>
  </div>
  <div class="variant-badge"><strong>P2</strong> Command Surface</div>
  <script src="../data.js"></script>
  <script>
    const p = EXVA_MOCK.portfolio;
    document.getElementById("equity").textContent = "$" + p.equity.toLocaleString("en-US", {minimumFractionDigits:2});
    document.getElementById("day-pnl").textContent = fmtSigned(p.dayPnl) + " (" + fmtPct(p.dayPnlPct) + ")";
    document.getElementById("open-risk").textContent = "$" + p.openRisk.toLocaleString();
    document.getElementById("positions-body").innerHTML = renderPositionsTable(EXVA_MOCK.positions, "NVDA");
    document.getElementById("attention-list").innerHTML = renderAttention(EXVA_MOCK.attention);
    document.getElementById("trace-inline").innerHTML = renderTrace(EXVA_MOCK.agentTrace.slice(0, 2));
    initCmdPalette({ openDefault: true, prefill: "nvda" });
    setInterval(flashTick, 5000);
  </script>
</body>
</html>

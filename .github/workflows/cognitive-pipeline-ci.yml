name: Cognitive Pipeline CI

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  acceptance:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.11

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Prompt budget and denylist tests
        run: bun run vitest run electron/main/services/ai/__tests__/pipeline-worker-prompts.test.ts

      - name: Cycle replay acceptance suite
        run: bun run vitest run electron/main/services/orchestration/replay/__tests__/cycle-replay-service.test.ts
